---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-reference
  namespace: flare-platform-reference
  labels:
    app.kubernetes.io/name: platform-reference
    app.kubernetes.io/part-of: flare-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-reference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-reference
        app.kubernetes.io/part-of: flare-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reference
          image: flare-platform-reference:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
