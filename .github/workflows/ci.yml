---
name: Platform CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request commit range
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          tools/quality/check-commit-range.sh pull_request
          "${RANGE_BASE_SHA}" "${HEAD_SHA}"
      - name: Validate push commit range
        if: github.event_name == 'push'
        env:
          HEAD_SHA: ${{ github.sha }}
          RANGE_BASE_SHA: ${{ github.event.before }}
        run: >-
          tools/quality/check-commit-range.sh push
          "${RANGE_BASE_SHA}" "${HEAD_SHA}"
      - name: Validate manual commit history
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: >-
          tools/quality/check-commit-range.sh push
          0000000000000000000000000000000000000000 "${HEAD_SHA}"
      - name: Bootstrap tools
        run: make bootstrap
      - name: Prove negative fixtures
        run: make prove-gates
      - name: Static checks
        run: make check

  kind-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap tools
        run: make bootstrap
      - name: Verify disposable Kubernetes path
        run: make verify-runtime
      - name: Collect bounded diagnostics
        id: diagnostics
        if: failure()
        run: |
          make diagnose
          make artifact-verify ARCHIVE=.platform/platform-diagnostics.zip
      - name: Upload bounded diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-kind-diagnostics
          path: |
            .platform/platform-diagnostics.zip
            .platform/platform-diagnostics.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
